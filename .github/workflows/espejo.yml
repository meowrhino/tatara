# Espejo del repo de la clienta
#
# Desde el traspaso (20 de octubre de 2026) la web vive en
# cristinanoguer/TATARAWEB y este repo es el archivo del estudio. Para tener
# siempre una copia de lo que hay allí (por si un día perdemos el acceso):
#
#   - cada noche (y con el botón "Run workflow") se trae su `main` y se guarda
#     tal cual en la rama `cliente` de este repo, con su etiqueta `publicado`;
#   - se prepara dist/ con esa copia (los mismos pasos que la publicación,
#     menos la subida) y se publica como Worker de Cloudflare, solo estático:
#     https://tatara-copia.manuellatourf.workers.dev (sin API: la botiga sale
#     agotada y los formularios no envían; es una copia, no la web).
#
# La web usa direcciones desde la raíz (/exposicions/…), así que necesita un
# dominio propio: por eso un Worker y no GitHub Pages (que la pondría en
# /tatara/ y rompería los enlaces).
#
# Necesita dos secrets de este repo: CLOUDFLARE_API_TOKEN (un token con permiso
# "Workers Scripts: Edit") y CLOUDFLARE_ACCOUNT_ID. Sin ellos, guarda la rama
# 'cliente' y prepara dist/, pero no publica.
#
# `main` se queda como lo entregado el 20 de octubre de 2026.

name: Espejo del repo de la clienta

on:
  schedule:
    - cron: '17 4 * * *'      # cada noche a las 04:17 UTC
  workflow_dispatch:

concurrency:
  group: espejo
  cancel-in-progress: false

permissions:
  contents: write             # para mover la rama 'cliente'

jobs:
  espejo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Traer el repo de la clienta a la rama 'cliente'
        run: |
          git fetch --force https://github.com/cristinanoguer/TATARAWEB.git main 'refs/tags/publicado:refs/tags/publicado'
          git push --force origin FETCH_HEAD:refs/heads/cliente
          git push --force origin refs/tags/publicado
          git checkout -q --detach FETCH_HEAD

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Revisar y preparar dist/ con la copia
        run: |
          node tools/check-data.mjs
          bash tools/build-pangea.sh
          # Sin API en la copia: ni el PHP ni el panel. Y que Google no la
          # indexe: la web de verdad es tatara.cat (cada página lleva su canonical).
          rm -rf dist/api dist/admin
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Publicar la copia como Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: rama 'cliente' al día, pero la copia no se publica."
            exit 0
          fi
          npx --yes wrangler@4 deploy --name tatara-copia --assets dist --compatibility-date 2026-10-01
